<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jogo da Velha</title>
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>h1 {color: white; font-family: 'Leixo', sans-serif;}body{background-color: rgb(15,140,232); font-family: 'Inter', sans-serif;}.board {display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; max-width: 300px; margin: 0 auto;}.cell {height: 95px; font-size: 2.25rem; font-weight: 700; aspect-ratio: 1/1; margin: auto;}</style>
  </head>
  <body>
    <h1 class="h3 text-center mb-4 mt-4">JOGO Da VELha</h1>
    <div class="alert d-flex justify-content-center"><div class="alert alert-info text-center py-2 max-w-200" id="status" role="status">Vez do jogador: <strong>X</strong></div></div>
    <div class="board" aria-label="Tabuleiro do jogo da velha"><button class="btn btn-outline-light cell" data-i="0" aria-label="Casa 1"></button><button class="btn btn-outline-light cell" data-i="1" aria-label="Casa 2"></button><button class="btn btn-outline-light cell" data-i="2" aria-label="Casa 3"></button><button class="btn btn-outline-light cell" data-i="3" aria-label="Casa 4"></button><button class="btn btn-outline-light cell" data-i="4" aria-label="Casa 5"></button><button class="btn btn-outline-light cell" data-i="5" aria-label="Casa 6"></button><button class="btn btn-outline-light cell" data-i="6" aria-label="Casa 7"></button><button class="btn btn-outline-light cell" data-i="7" aria-label="Casa 8"></button><button class="btn btn-outline-light cell" data-i="8" aria-label="Casa 9"></button></div>
    <div class="alert d-flex justify-content-center"><button id="newRound" class="btn btn-danger max-w-100">Nova rodada</button></div>
    <div class="d-flex justify-content-center"><a class="alert alert-info" href="velha.html">Outra versão</a></div>
    <script src="https://kawhe.com.br/assets/kawhe-signature.js"></script>
    <script src="https://kawhe.com.br/assets/logica-velha.js"></script>
  </body>
</html>
